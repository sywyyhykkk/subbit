name: Build release installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install universal macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run check
      - run: npm run catalog:check
      - run: npm run test:pricing
      - name: Check release version
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const read = path => JSON.parse(fs.readFileSync(path, 'utf8'));
          const version = read('package.json').version;
          assert.equal(read('package-lock.json').version, version);
          assert.equal(read('package-lock.json').packages[''].version, version);
          assert.equal(read('src-tauri/tauri.conf.json').version, version);
          assert.equal(fs.readFileSync('src-tauri/Cargo.toml', 'utf8').match(/^version = "([^"]+)"/m)[1], version);
          if (process.env.GITHUB_REF_TYPE === 'tag') assert.equal(process.env.GITHUB_REF_NAME, `v${version}`);
          JS
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build universal DMG
        if: runner.os == 'macOS'
        run: npm run tauri build -- --target universal-apple-darwin --bundles dmg
      - name: Verify DMG contents and packaged MCP
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          dmg=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          hdiutil verify "$dmg"
          mount="$RUNNER_TEMP/subbit-dmg"
          mkdir -p "$mount" artifacts
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          lipo -verify_arch arm64 x86_64 "$mount/Subbit.app/Contents/MacOS/subbit"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$mount/Subbit.app/Contents/Info.plist")" = "$version"
          python3 scripts/smoke-mcp.py "$mount/Subbit.app/Contents/MacOS/subbit"
          cp "$dmg" "artifacts/Subbit_${version}_macos-universal.dmg"
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npm run tauri build -- --bundles nsis
      - name: Install and verify Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP 'Subbit-install'
          $setup = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer exited with $($setup.ExitCode)" }
          $binary = Join-Path $installDir 'subbit.exe'
          if (!(Test-Path $binary)) { throw 'Installed executable is missing' }
          python scripts/smoke-mcp.py $binary
          if ($LASTEXITCODE -ne 0) { throw 'Installed MCP smoke test failed' }
          $env:SUBBIT_CONFIG_DIR = Join-Path $env:RUNNER_TEMP 'Subbit-launch'
          $app = Start-Process -FilePath $binary -PassThru
          try {
            for ($i = 0; $i -lt 15; $i++) {
              Start-Sleep -Seconds 2
              $app.Refresh()
              if ($app.HasExited) { throw "Application exited before opening a window: $($app.ExitCode)" }
              if ($app.MainWindowHandle -ne 0) { break }
            }
            if ($app.MainWindowHandle -eq 0) { throw 'Application did not open a native window' }
            Write-Output 'Installed application opened its native window.'
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id }
          }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item $installer.FullName "artifacts/Subbit_${version}_windows-x64-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: artifacts/*
          if-no-files-found: error

  draft-release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: artifacts
      - name: Create release draft with both verified installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(find artifacts -type f | wc -l)" -eq 2
          gh release create "$GITHUB_REF_NAME" artifacts/*.dmg artifacts/*.exe \
            --verify-tag --draft --title "Subbit $GITHUB_REF_NAME" \
            --notes-file docs/releases/0.0.1.md
