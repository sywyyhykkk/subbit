name: Build release installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      source_ref:
        description: Existing tag or commit to rebuild (blank uses this ref)
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
          - os: windows-latest
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run check
      - run: npm run catalog:check
      - run: npm run test:pricing
      - run: npm run test:dates
      - run: npm run test:levels
      - name: Check release version
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const read = path => JSON.parse(fs.readFileSync(path, 'utf8'));
          const version = read('package.json').version;
          assert.equal(read('package-lock.json').version, version);
          assert.equal(read('package-lock.json').packages[''].version, version);
          assert.equal(read('src-tauri/tauri.conf.json').version, version);
          assert.equal(fs.readFileSync('src-tauri/Cargo.toml', 'utf8').match(/^version = "([^"]+)"/m)[1], version);
          if (process.env.GITHUB_REF_TYPE === 'tag') assert.equal(process.env.GITHUB_REF_NAME, `v${version}`);
          JS
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build architecture-specific DMG
        if: runner.os == 'macOS'
        run: npm run tauri build -- --bundles app,dmg
      - name: Verify DMG contents and packaged MCP
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          dmg=$(find src-tauri/target/release/bundle/dmg -name '*.dmg' -print -quit)
          hdiutil verify "$dmg"
          mount="$RUNNER_TEMP/subbit-dmg"
          mkdir -p "$mount" artifacts
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          test "$(lipo "$mount/Subbit.app/Contents/MacOS/subbit" -archs)" = "${{ matrix.arch }}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$mount/Subbit.app/Contents/Info.plist")" = "$version"
          codesign --verify --deep --strict --verbose=2 "$mount/Subbit.app"
          codesign -dv --verbose=2 "$mount/Subbit.app"
          python3 scripts/smoke-mcp.py "$mount/Subbit.app/Contents/MacOS/subbit"
          cp "$dmg" "artifacts/Subbit_${version}_macos-${{ matrix.arch }}.dmg"
          updater=$(find src-tauri/target/release/bundle/macos -name '*.app.tar.gz' -print -quit)
          test -s "$updater.sig"
          cp "$updater" "artifacts/Subbit_${version}_macos-${{ matrix.arch }}.app.tar.gz"
          cp "$updater.sig" "artifacts/Subbit_${version}_macos-${{ matrix.arch }}.app.tar.gz.sig"
          mkdir "$RUNNER_TEMP/subbit-update-check"
          tar -xzf "$updater" -C "$RUNNER_TEMP/subbit-update-check"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/subbit-update-check/Subbit.app"
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npm run tauri build -- --bundles nsis
      - name: Install and verify Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP 'Subbit-install'
          $setup = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer exited with $($setup.ExitCode)" }
          $binary = Join-Path $installDir 'subbit.exe'
          if (!(Test-Path $binary)) { throw 'Installed executable is missing' }
          python scripts/smoke-mcp.py $binary
          if ($LASTEXITCODE -ne 0) { throw 'Installed MCP smoke test failed' }
          $env:SUBBIT_CONFIG_DIR = Join-Path $env:RUNNER_TEMP 'Subbit-launch'
          $app = Start-Process -FilePath $binary -PassThru
          try {
            for ($i = 0; $i -lt 15; $i++) {
              Start-Sleep -Seconds 2
              $app.Refresh()
              if ($app.HasExited) { throw "Application exited before opening a window: $($app.ExitCode)" }
              if ($app.MainWindowHandle -ne 0) { break }
            }
            if ($app.MainWindowHandle -eq 0) { throw 'Application did not open a native window' }
            Write-Output 'Installed application opened its native window.'
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id }
          }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item $installer.FullName "artifacts/Subbit_${version}_windows-x64-setup.exe"
          Copy-Item ($installer.FullName + '.sig') "artifacts/Subbit_${version}_windows-x64-setup.exe.sig"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: artifacts/*
          if-no-files-found: error

  publish-release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: artifacts
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/release-manifest.mjs artifacts
      - name: Publish all installers and signed update bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Replace rebuilt packages without editing the existing announcement.
            gh release upload "$GITHUB_REF_NAME" artifacts/*.dmg artifacts/*.exe artifacts/*.tar.gz artifacts/*.sig --clobber
            gh release upload "$GITHUB_REF_NAME" artifacts/latest.json --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* \
              --verify-tag --latest --title "Subbit $GITHUB_REF_NAME" \
              --notes-file "docs/releases/${version}.md"
          fi
